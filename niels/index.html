<!doctype html>
<html style="width:100%;height:100%;">
<head>
	<meta charset="utf-8">
	<meta name="description" content="">
	<title>Niels Example</title>
</head>
<body style="width:100%;height:100%;margin: 0;">
	<script src="https://d3js.org/d3.v5.min.js"></script>
	<style>
		.dashboard { 
            display: grid; 
            gap: 20px; 
            height: 100vh; 
            padding: 20px; 
            box-sizing: border-box; 
        }

		.chart-container { 
			border: 1px solid #000000; 
			background: #ffffff; 
			display: flex; 
			flex-direction: column;
			border-radius: 4px;
		}
		.full-width { 
            grid-column: span 2; 
        }
	</style>
    <div class="dashboard">
        <div id="chart1" class="chart-container">
            <h3>Heading1</h3>
        </div>
        <div id="chart2" class="chart-container">
            <h3>Heading2</h3>
        </div>
        <div id="chart3" class="chart-container full-width">
            <h3>Heading3</h3>
        </div>
    </div>

	<script src="main.js"></script>
</body>
</html>
