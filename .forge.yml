version: 0.1

repo:
  default_branch: main

paths:
  docs_root: docs
  tickets_root: docs/tickets
  protected:
    - .github/workflows/**
    - .github/CODEOWNERS

commands:
  format:
    - sh -c "if rg -n '\\r$' --glob '*.md' .; then echo 'CRLF line endings found in markdown files'; exit 1; else echo 'markdown line endings normalized'; fi"
  lint:
    - sh -c "if rg -n '[[:blank:]]+$' --glob '*.md' .; then echo 'Trailing whitespace found in markdown files'; exit 1; else echo 'markdown trailing whitespace check passed'; fi"
  typecheck: []
  test:
    - node -e "['.forge.yml','CONTRIBUTING.md','.github/pull_request_template.md','.github/workflows/markdownlint.yml','docs/tickets'].forEach((p)=>require('node:fs').accessSync(p)); console.log('pilot baseline files present')"
